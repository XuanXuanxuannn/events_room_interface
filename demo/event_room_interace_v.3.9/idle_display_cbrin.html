<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBRIN Idle Billboard Display</title>
  <style>
    :root{--bg:#060414;--text:#fff;--muted:rgba(255,255,255,.72);--panel:rgba(9,6,25,.45)}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Avenir,"Avenir Next",Arial,sans-serif;color:var(--text)}
    .stage{position:fixed;inset:0;background:#060414;overflow:hidden;cursor:none}
    .slide{position:absolute;inset:0;opacity:0;transition:opacity 900ms ease;background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.005)}
    .slide.active{opacity:1}
    .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,4,20,.62) 0%,rgba(6,4,20,.22) 44%,rgba(6,4,20,.18) 100%);pointer-events:none}
    .copy{position:absolute;z-index:3;left:5vw;bottom:6vh;max-width:min(720px,62vw);padding:24px 28px;border-radius:24px;background:var(--panel);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
    .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}.title{font-size:clamp(36px,5vw,84px);line-height:1.02;font-weight:900;margin:0}.desc{font-size:clamp(16px,1.6vw,24px);line-height:1.55;color:rgba(255,255,255,.86);margin:16px 0 0}.status{position:absolute;right:24px;bottom:20px;z-index:4;color:rgba(255,255,255,.58);font-size:13px;background:rgba(0,0,0,.22);padding:8px 12px;border-radius:999px}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px}.empty-card{max-width:720px;padding:34px;border-radius:28px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06)}.empty h1{font-size:44px;margin:0 0 12px}.empty p{color:var(--muted);line-height:1.7}.hidden{display:none!important}
    .screen-share-overlay{
      position:fixed;
      inset:0;
      z-index:50;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .screen-share-overlay.hidden{
      display:none!important;
    }

    .screen-share-video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }

    .screen-share-display-status{
      position:absolute;
      left:24px;
      bottom:20px;
      z-index:52;
      color:rgba(255,255,255,.82);
      font-size:13px;
      background:rgba(0,0,0,.42);
      padding:8px 12px;
      border-radius:999px;
    }
    @media (max-width:700px){.copy{left:18px;right:18px;bottom:24px;max-width:none;padding:18px}.title{font-size:36px}.desc{font-size:16px}.status{display:none}}
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div id="slideA" class="slide active"></div>
    <div id="slideB" class="slide"></div>
    <div class="shade"></div>
    <section class="copy" id="copyBox">
      <div class="eyebrow" id="typeText">CBRIN</div>
      <h1 class="title" id="titleText">Loading billboard...</h1>
      <p class="desc" id="descText">Images uploaded from the admin page will appear here.</p>
    </section>
    <div class="status" id="statusText">Idle display</div>
    <section class="empty hidden" id="emptyState"><div class="empty-card"><h1>No idle slides yet</h1><p>Open the admin page and upload billboard images. This display will automatically refresh from the backend API.</p></div></section>
    <section id="screenShareDisplayOverlay" class="screen-share-overlay hidden">
      <video id="remoteScreenShareVideo" class="screen-share-video" autoplay playsinline></video>
      <div id="screenShareDisplayStatus" class="screen-share-display-status">
        Screen share display is waiting.
      </div>
    </section>
  </main>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const API = '/api/idle-slides';
  const ROTATE_MS = 9000;
  const REFRESH_MS = 30000;

  const params = new URLSearchParams(window.location.search);

  const SCREEN_SHARE_API_BASE = window.SCREEN_SHARE_API_BASE || 'http://127.0.0.1:5000';
  const SCREEN_SHARE_SOCKET_URL = SCREEN_SHARE_API_BASE;
  const SCREEN_SHARE_ROOM_ID = (
    params.get('screen_room') ||
    params.get('screenRoom') ||
    params.get('room') ||
    ''
  ).replace(/\s/g, '');

  let screenShareSocket = null;

  let screenSharePeerConnection = null;
  let remoteScreenShareStream = null;
  let pendingScreenShareIceCandidates = [];

  const SCREEN_SHARE_RTC_CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' }
    ]
  };

  let slides = [];
  let index = 0;
  let usingA = true;
  const a = document.getElementById('slideA');
  const b = document.getElementById('slideB');
  const titleText = document.getElementById('titleText');
  const descText = document.getElementById('descText');
  const typeText = document.getElementById('typeText');
  const statusText = document.getElementById('statusText');
  const emptyState = document.getElementById('emptyState');
  const copyBox = document.getElementById('copyBox');

  function updateScreenShareDisplayStatus(message) {
    const displayStatus = document.getElementById('screenShareDisplayStatus');

    if (displayStatus) {
      displayStatus.textContent = message;
    }

    if (statusText) {
      statusText.textContent = message;
    }

    console.log('[Idle Display Screen Share]', message);
  }

  function getScreenShareRoomIdForDisplay() {
    if (!SCREEN_SHARE_ROOM_ID) {
      updateScreenShareDisplayStatus('No screen_room found in URL. Billboard mode only.');
      return '';
    }

    return SCREEN_SHARE_ROOM_ID;
  }

  function initScreenShareSocketForIdleDisplay() {
    if (screenShareSocket) {
      return screenShareSocket;
    }

    if (!window.io) {
      updateScreenShareDisplayStatus('Socket.IO client not loaded.');
      return null;
    }

    screenShareSocket = io(SCREEN_SHARE_SOCKET_URL);

    screenShareSocket.on('connect', () => {
      updateScreenShareDisplayStatus(
        'Connected to Flask screen share backend. Socket ID: ' + screenShareSocket.id
      );
    });

    screenShareSocket.on('disconnect', () => {
      updateScreenShareDisplayStatus('Disconnected from Flask screen share backend.');
    });

    screenShareSocket.on('screen-share-room-joined', (data) => {
      updateScreenShareDisplayStatus(
        'Joined screen share room ' + data.room + ' as ' + data.role + '. Waiting for presenter...'
      );

      console.log('[Idle Display Screen Share] room joined:', data);
    });

    screenShareSocket.on('participant-joined', (data) => {
      console.log('[Idle Display Screen Share] participant joined:', data);

      if (data && data.role === 'presenter') {
        updateScreenShareDisplayStatus(
          'Presenter joined room ' + data.room + '. Waiting for screen share offer...'
        );
      }
    });

    screenShareSocket.on('screen-share-offer', async (data) => {
      console.log('[Idle Display Screen Share] received offer:', data);

      if (!data || !data.offer) {
        updateScreenShareDisplayStatus('Received invalid screen share offer.');
        return;
      }

      await handleScreenShareOfferFromPresenter(data.offer);
    });

    screenShareSocket.on('ice-candidate', async (data) => {
      console.log('[Idle Display Screen Share] received ICE candidate:', data);

      if (!data || !data.candidate) {
        return;
      }

      await handleScreenShareIceCandidateFromPresenter(data.candidate);
    });


    screenShareSocket.on('screen-share-error', (data) => {
      updateScreenShareDisplayStatus(
        'Screen share error: ' + (data && data.error ? data.error : 'unknown error')
      );

      console.error('[Idle Display Screen Share] error:', data);
    });

    screenShareSocket.on('stop-screen-share', (data) => {
      updateScreenShareDisplayStatus('Screen share stopped. Returning to billboard.');

      console.log('[Idle Display Screen Share] stop received:', data);

      cleanupIdleDisplayWebRTC('backend stop event');
    });

    return screenShareSocket;
  }

  function joinScreenShareRoomFromIdleDisplay() {
    const room = getScreenShareRoomIdForDisplay();

    if (!room) {
      return;
    }

    const socket = initScreenShareSocketForIdleDisplay();

    if (!socket) {
      return;
    }

    function emitJoinRoom() {
      socket.emit('join-screen-share-room', {
        room: room,
        role: 'display'
      });

      updateScreenShareDisplayStatus('Joining screen share room ' + room + ' as display...');
    }

    if (socket.connected) {
      emitJoinRoom();
    } else {
      updateScreenShareDisplayStatus('Connecting to Flask screen share backend...');
      socket.once('connect', emitJoinRoom);
    }
  }

  function showScreenShareOverlay() {
    const overlay = document.getElementById('screenShareDisplayOverlay');

    if (overlay) {
      overlay.classList.remove('hidden');
    }
  }

  function hideScreenShareOverlay() {
    const overlay = document.getElementById('screenShareDisplayOverlay');

    if (overlay) {
      overlay.classList.add('hidden');
    }
  }

  function createIdleDisplayPeerConnection(socket, room) {
    const peerConnection = new RTCPeerConnection(SCREEN_SHARE_RTC_CONFIG);

    peerConnection.onicecandidate = (event) => {
      if (!event.candidate) {
        return;
      }

      socket.emit('ice-candidate', {
        room: room,
        role: 'display',
        candidate: event.candidate
      });

      console.log('[Idle Display Screen Share] sent ICE candidate:', event.candidate);
    };

    peerConnection.ontrack = (event) => {
      console.log('[Idle Display Screen Share] received remote track:', event.track.kind);

      if (!remoteScreenShareStream) {
        remoteScreenShareStream = new MediaStream();
      }

      remoteScreenShareStream.addTrack(event.track);

      const video = document.getElementById('remoteScreenShareVideo');

      if (video) {
        video.srcObject = remoteScreenShareStream;
        video.play().catch(() => {});
      }

      showScreenShareOverlay();

      updateScreenShareDisplayStatus('Screen share active.');
    };

    peerConnection.onconnectionstatechange = () => {
      console.log(
        '[Idle Display Screen Share] peer connection state:',
        peerConnection.connectionState
      );

      updateScreenShareDisplayStatus(
        'WebRTC connection state: ' + peerConnection.connectionState
      );

      if (
        peerConnection.connectionState === 'disconnected' ||
        peerConnection.connectionState === 'failed' ||
        peerConnection.connectionState === 'closed'
      ) {
        cleanupIdleDisplayWebRTC('peer connection ' + peerConnection.connectionState);
      }
    };

    peerConnection.oniceconnectionstatechange = () => {
      console.log(
        '[Idle Display Screen Share] ICE connection state:',
        peerConnection.iceConnectionState
      );
    };

    return peerConnection;
  }

  async function handleScreenShareOfferFromPresenter(offer) {
    const room = getScreenShareRoomIdForDisplay();

    if (!room) {
      updateScreenShareDisplayStatus('Cannot handle offer because screen_room is missing.');
      return;
    }

    const socket = initScreenShareSocketForIdleDisplay();

    if (!socket) {
      updateScreenShareDisplayStatus('Cannot handle offer because Socket.IO is not ready.');
      return;
    }

    cleanupIdleDisplayWebRTC('new offer received');

    screenSharePeerConnection = createIdleDisplayPeerConnection(socket, room);

    await screenSharePeerConnection.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    updateScreenShareDisplayStatus('Received WebRTC offer. Creating answer...');

    await flushPendingScreenShareIceCandidates();

    const answer = await screenSharePeerConnection.createAnswer();

    await screenSharePeerConnection.setLocalDescription(answer);

    socket.emit('screen-share-answer', {
      room: room,
      role: 'display',
      answer: answer
    });

    updateScreenShareDisplayStatus('Sent WebRTC answer to Presenter.');

    console.log('[Idle Display Screen Share] sent WebRTC answer:', answer);
  }

  async function handleScreenShareIceCandidateFromPresenter(candidate) {
    if (!screenSharePeerConnection) {
      pendingScreenShareIceCandidates.push(candidate);
      console.log('[Idle Display Screen Share] stored ICE candidate because peer connection is not ready.');
      return;
    }

    if (
      !screenSharePeerConnection.remoteDescription ||
      !screenSharePeerConnection.remoteDescription.type
    ) {
      pendingScreenShareIceCandidates.push(candidate);
      console.log('[Idle Display Screen Share] stored ICE candidate because remote description is not ready.');
      return;
    }

    await screenSharePeerConnection.addIceCandidate(
      new RTCIceCandidate(candidate)
    );

    console.log('[Idle Display Screen Share] added ICE candidate from Presenter.');
  }

  async function flushPendingScreenShareIceCandidates() {
    if (!screenSharePeerConnection) {
      return;
    }

    while (pendingScreenShareIceCandidates.length > 0) {
      const candidate = pendingScreenShareIceCandidates.shift();

      await screenSharePeerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

      console.log('[Idle Display Screen Share] added pending ICE candidate.');
    }
  }

  function cleanupIdleDisplayWebRTC(reason = 'cleanup') {
    console.log('[Idle Display Screen Share] cleanup reason:', reason);

    if (screenSharePeerConnection) {
      screenSharePeerConnection.onicecandidate = null;
      screenSharePeerConnection.ontrack = null;
      screenSharePeerConnection.onconnectionstatechange = null;
      screenSharePeerConnection.oniceconnectionstatechange = null;
      screenSharePeerConnection.close();
      screenSharePeerConnection = null;
    }

    pendingScreenShareIceCandidates = [];

    if (remoteScreenShareStream) {
      remoteScreenShareStream.getTracks().forEach((track) => {
        track.stop();
      });

      remoteScreenShareStream = null;
    }

    const video = document.getElementById('remoteScreenShareVideo');

    if (video) {
      video.srcObject = null;
    }

    hideScreenShareOverlay();

    updateScreenShareDisplayStatus('Billboard mode. Waiting for screen share.');
  }


  function imageUrl(src){
    if (!src) return '';
    if (/^https?:\/\//i.test(src)) return src;
    return src;
  }
  function showSlide(i){
    if (!slides.length) {
      emptyState.classList.remove('hidden'); copyBox.classList.add('hidden');
      a.style.backgroundImage = ''; b.style.backgroundImage = '';
      return;
    }
    emptyState.classList.add('hidden'); copyBox.classList.remove('hidden');
    index = (i + slides.length) % slides.length;
    const slide = slides[index];
    const target = usingA ? b : a;
    const current = usingA ? a : b;
    target.style.backgroundImage = `url("${imageUrl(slide.src)}")`;
    titleText.textContent = slide.title || 'CBRIN Event Space';
    descText.textContent = slide.description || '';
    typeText.textContent = (slide.type || 'CBRIN').toUpperCase();
    statusText.textContent = `${index + 1} / ${slides.length}`;
    target.classList.add('active'); current.classList.remove('active'); usingA = !usingA;
  }
  async function loadSlides(){
    try{
      const res = await fetch(API, { cache:'no-store' });
      if (!res.ok) throw new Error('API failed');
      const data = await res.json();
      slides = Array.isArray(data) ? data.filter(s => s && s.src) : [];
      if (index >= slides.length) index = 0;
      showSlide(index);
    }catch(err){
      titleText.textContent = 'Cannot load idle slides';
      descText.textContent = 'Check that the backend server is running.';
      statusText.textContent = 'Offline';
      console.error(err);
    }
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') showSlide(index + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') showSlide(index - 1);
    if (e.key.toLowerCase() === 'f' && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  loadSlides();
  setInterval(() => showSlide(index + 1), ROTATE_MS);
  setInterval(loadSlides, REFRESH_MS);

  if (SCREEN_SHARE_ROOM_ID) {
    updateScreenShareDisplayStatus('Screen room loaded from URL: ' + SCREEN_SHARE_ROOM_ID);
    joinScreenShareRoomFromIdleDisplay();
  }
</script>
</body>
</html>
